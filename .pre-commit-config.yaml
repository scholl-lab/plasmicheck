repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (uv.lock)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: Mypy strict typecheck (uv.lock)
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: pytest-fast
        name: Portable unit tests (pre-push)
        entry: uv run --locked pytest -m "not slow and not integration" -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
