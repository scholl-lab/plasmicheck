$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration schema for the PlasmiCheck Snakemake cohort workflow.

type: object
additionalProperties: false

properties:
  human_fasta:
    type: string
    minLength: 1
    description: Path to the human reference genome FASTA file.

  samples:
    description: >
      Sample inputs as a path to a TSV sample sheet ('sample\tbam' or 'corrected_id'),
      a newline-delimited BAM list file, a list of BAM paths, or a {sample_id: bam_path} mapping.
    oneOf:
      - type: string
        minLength: 1
      - type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      - type: object
        minProperties: 1
        additionalProperties:
          type: string
          minLength: 1

  bams_file:
    type:
      - "string"
      - "null"
    default: null
    description: Legacy path to newline-delimited BAM file list (fallback data/bams.txt).

  bam_folder:
    type:
      - "string"
      - "null"
    default: null
    description: Directory containing per-sample BAMs when using a sample_map TSV without a bam column.

  bam_dir:
    type:
      - "string"
      - "null"
    default: null
    description: Alias for bam_folder.

  bam_ext:
    type: string
    default: ".merged.dedup.bqsr.bam"
    description: BAM filename suffix appended to sample IDs when resolving from bam_folder.

  plasmids_file:
    type:
      - "string"
      - "null"
    default: null
    description: Path to plasmid construct file or newline-delimited construct list (.txt).

  constructs:
    description: Explicit list of plasmid construct paths or path to construct list file.
    oneOf:
      - type: "null"
      - type: string
        minLength: 1
      - type: array
        minItems: 1
        items:
          type: string
          minLength: 1

  output_dir:
    type: string
    default: "output"
    description: Root output directory for per-sample comparison outputs and reports.

  summary_dir:
    type: string
    default: "output/summary"
    description: Output directory for cohort summary reports and tables.

  log_dir:
    type: string
    default: "logs"
    description: Directory for rule completion markers and per-sample logs.

  cache_dir:
    type:
      - "string"
      - "null"
    default: ".plasmicheck_cache"
    description: Shared content-addressable cache directory for indexes and spliced alignments.

  conda_env:
    type: string
    default: "plasmicheck"
    description: Conda environment name or YAML path for Snakemake execution.

  regions_bed:
    type:
      - "string"
      - "null"
    default: null
    description: Optional BED file restricting BAM read extraction to construct target regions.

  include_unmapped:
    type: boolean
    default: true
    description: Include unmapped reads alongside regions_bed during BAM extraction.

  target_bed:
    type:
      - "string"
      - "null"
    default: null
    description: Optional exome capture target BED file for sample median depth normalisation.

  target_bed_max_intervals:
    type: integer
    minimum: 0
    default: 5000
    description: Seeded random subsample size of target_bed intervals used for the sample median depth (0 = all).

  target_bed_seed:
    type: integer
    default: 42
    description: Random seed for the target_bed interval subsample (deterministic).

  minimap2_threads:
    type:
      - "integer"
      - "null"
    minimum: 1
    default: null
    description: minimap2 threads per alignment in scan_sample (null = half of the rule's threads when the two alignments run concurrently).

  gtf_file:
    type:
      - "string"
      - "null"
    default: null
    description: Optional GTF/MANE annotation file to resolve exon-exon junctions.

  gtf:
    type:
      - "string"
      - "null"
    default: null
    description: Alias for gtf_file.

  mane_gtf:
    type:
      - "string"
      - "null"
    default: null
    description: Alias for gtf_file.

  vcf_file:
    type:
      - "string"
      - "null"
    default: null
    description: Optional VCF/BCF/TSV file to flag variants at construct-insert positions.

  vcf:
    type:
      - "string"
      - "null"
    default: null
    description: Alias for vcf_file.

  threshold:
    type:
      - "number"
      - "null"
    exclusiveMinimum: 0
    default: 0.8
    description: Plasmid-to-human ratio threshold for contamination verdict.

  padding:
    type:
      - "integer"
      - "null"
    minimum: 0
    default: 1000
    description: Genomic padding (bp) around spliced alignment spans.

  shift_bases:
    type:
      - "integer"
      - "null"
    minimum: 0
    default: 500
    description: Number of bases to shift in the shifted plasmid reference.

  generate_shifted:
    type: boolean
    default: false
    description: Generate a shifted plasmid reference sequence during FASTA conversion.

  static_report:
    type: boolean
    default: false
    description: Generate static PNG reports alongside interactive HTML reports.

  archive_output:
    type: boolean
    default: false
    description: Archive and compress per-sample output folders into .tar.gz files.

  overwrite:
    type: boolean
    default: false
    description: Overwrite existing indexes and intermediate files.

  substring_to_remove:
    type:
      - "string"
      - "null"
    default: null
    description: Optional substring stripped from sample names in summary_reports.

  extra_args:
    type:
      - "string"
      - "null"
    default: null
    description: Additional CLI flags appended to plasmicheck pipeline.

  resources:
    type: object
    additionalProperties: false
    description: Per-rule SLURM resource overrides (walltime runtime <= 120 min).
    properties:
      prepare_constructs:
        $ref: "#/$defs/rule_resources"
      scan_sample:
        $ref: "#/$defs/rule_resources"
      summary_reports:
        $ref: "#/$defs/rule_resources"

$defs:
  rule_resources:
    type: object
    additionalProperties: false
    properties:
      threads:
        type: integer
        minimum: 1
      mem_mb:
        type: integer
        minimum: 100
      runtime:
        type: integer
        minimum: 1
        maximum: 120
        description: Maximum per-job walltime in minutes (< 2 hours).
